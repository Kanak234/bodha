<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="#0d1b2a"/>

  <!-- Pipeline stages as connected nodes -->
  <defs>
    <linearGradient id="pipelineGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4fc3f7"/>
      <stop offset="25%" stop-color="#ba68c8"/>
      <stop offset="50%" stop-color="#66bb6a"/>
      <stop offset="75%" stop-color="#ffca28"/>
      <stop offset="100%" stop-color="#ef5350"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Stage circles with connecting lines -->
  <g stroke="url(#pipelineGradient)" stroke-width="3" fill="none" filter="url(#glow)">
    <!-- Connecting lines -->
    <path d="M 24 64 L 44 64 M 84 64 L 104 64" stroke-dasharray="4,2"/>
  </g>

  <!-- Source code stage -->
  <circle cx="32" cy="64" r="18" fill="#0d1b2a" stroke="#4fc3f7" stroke-width="2"/>
  <text x="32" y="68" text-anchor="middle" font-size="14" font-weight="bold" fill="#4fc3f7" font-family="monospace">S</text>

  <!-- Lexical/Tokens stage -->
  <circle cx="64" cy="32" r="18" fill="#0d1b2a" stroke="#ba68c8" stroke-width="2"/>
  <text x="64" y="36" text-anchor="middle" font-size="12" font-weight="bold" fill="#ba68c8" font-family="monospace">T</text>

  <!-- AST stage -->
  <circle cx="96" cy="64" r="18" fill="#0d1b2a" stroke="#66bb6a" stroke-width="2"/>
  <text x="96" y="68" text-anchor="middle" font-size="12" font-weight="bold" fill="#66bb6a" font-family="monospace">A</text>

  <!-- IR/Assembly stage -->
  <circle cx="64" cy="96" r="18" fill="#0d1b2a" stroke="#ffca28" stroke-width="2"/>
  <text x="64" y="100" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffca28" font-family="monospace">IR</text>

  <!-- Center: understanding/knowledge symbol -->
  <circle cx="64" cy="64" r="22" fill="url(#pipelineGradient)" opacity="0.15"/>
  <text x="64" y="68" text-anchor="middle" font-size="10" font-weight="600" fill="#e8f0f8" letter-spacing="0.5px">BODHA</text>

  <!-- Connecting lines from center -->
  <g stroke="#4fc3f7" stroke-width="1.5" opacity="0.6">
    <line x1="64" y1="42" x2="64" y2="14"/>
    <line x1="82" y1="64" x2="114" y2="64"/>
    <line x1="64" y1="86" x2="64" y2="114"/>
    <line x1="46" y1="64" x2="14" y2="64"/>
  </g>
</svg>