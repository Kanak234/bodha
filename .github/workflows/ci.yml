name: CI

on:
  push:
    branches: [master, main, prod-hardening]
  pull_request:
    branches: [master, main, prod-hardening]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Node ${{ matrix.node-version }} Test & Build
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install compiler toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc g++ python3 default-jdk-headless

      - name: Install dependencies
        run: npm ci

      - name: Compile TypeScript
        run: npm run compile

      - name: Lint source
        run: npm run lint

      - name: Run test suite with coverage
        run: npm run test:coverage

      - name: Package VSIX bundle
        run: |
          mkdir -p dist
          npx @vscode/vsce package --allow-missing-repository --out dist/

  docker:
    name: Container Build & Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: bodha:smoke

      - name: Run Container Smoke Tests
        run: |
          docker run --rm bodha:smoke node test/run-tests.js
